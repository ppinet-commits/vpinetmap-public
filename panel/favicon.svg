<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Órbitas / Espirales galácticas elegantes -->
  <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(-30 32 32)" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.45"/>
  <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(30 32 32)" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.45"/>
  <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(90 32 32)" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- Líneas de interconexión directa entre nodos -->
  <g stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <line x1="32" y1="32" x2="32" y2="10"/>
    <line x1="32" y1="32" x2="52" y2="21"/>
    <line x1="32" y1="32" x2="49" y2="44"/>
    <line x1="32" y1="32" x2="32" y2="54"/>
    <line x1="32" y1="32" x2="15" y2="44"/>
    <line x1="32" y1="32" x2="12" y2="21"/>

    <!-- Conexiones perimetrales entre nodos -->
    <line x1="32" y1="10" x2="52" y2="21" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
    <line x1="52" y1="21" x2="49" y2="44" stroke="#818cf8" stroke-width="1.4" opacity="0.6"/>
    <line x1="49" y1="44" x2="32" y2="54" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
    <line x1="32" y1="54" x2="15" y2="44" stroke="#818cf8" stroke-width="1.4" opacity="0.6"/>
    <line x1="15" y1="44" x2="12" y2="21" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
    <line x1="12" y1="21" x2="32" y2="10" stroke="#818cf8" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- Nodos menores / Satélites -->
  <circle cx="23" cy="21" r="1.8" fill="#38bdf8"/>
  <circle cx="41" cy="21" r="1.8" fill="#818cf8"/>
  <circle cx="43" cy="37" r="1.8" fill="#38bdf8"/>
  <circle cx="21" cy="37" r="1.8" fill="#818cf8"/>

  <!-- Nodos perimetrales principales -->
  <circle cx="32" cy="10" r="3.2" fill="#0284c7"/>
  <circle cx="52" cy="21" r="3.5" fill="#4f46e5"/>
  <circle cx="49" cy="44" r="3.5" fill="#2563eb"/>
  <circle cx="32" cy="54" r="3.2" fill="#0ea5e9"/>
  <circle cx="15" cy="44" r="3.5" fill="#4f46e5"/>
  <circle cx="12" cy="21" r="3.5" fill="#2563eb"/>

  <!-- Centro: Núcleo / Hub galáctico -->
  <circle cx="32" cy="32" r="7.5" fill="#2563eb" fill-opacity="0.18"/>
  <circle cx="32" cy="32" r="5.2" fill="#1d4ed8"/>
  <circle cx="32" cy="32" r="2.2" fill="#ffffff"/>
</svg>