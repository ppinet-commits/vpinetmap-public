    vpnSelect.appendChild(opt);
  });

  async function loadTrafficData(){
    const dateVal = $("#trCustomDate").value;
    const vpnVal = $("#trVpnFilter").value;
    const userVal = $("#trUserFilter").value;

    let rangeParam = currentRange;
    if (dateVal) rangeParam = dateVal;

    const qs = new URLSearchParams();
    if (rangeParam) qs.set("range", rangeParam);
    if (vpnVal) qs.set("vpn", vpnVal);
    if (userVal) qs.set("user", userVal);

    try {
      $("#trErr").textContent = "";
      if (onlyLive) {
        const liveRes = await api("/api/traffic/live");
        const liveSessions = liveRes.sessions || liveRes.live || [];
        renderTraffic({
          summary: {
            total_sessions: liveRes.active_count || liveSessions.length,
            active_sessions: liveRes.active_count || liveSessions.length,
            total_duration_sec: liveSessions.reduce((a, s) => a + (s.duration_sec || 0), 0),
            total_bytes_sent: liveSessions.reduce((a, s) => a + (s.bytes_sent || 0), 0),
            total_bytes_recv: liveSessions.reduce((a, s) => a + (s.bytes_recv || 0), 0),
            by_vpn: {},
            by_user: {}
          },
          sessions: liveSessions
        });
        return;
      }

      const [sumRes, sessRes] = await Promise.all([
        api(`/api/traffic/summary?${qs.toString()}`),
        api(`/api/traffic/sessions?${qs.toString()}&limit=500`)
      ]);

      renderTraffic({
        summary: sumRes.summary || sumRes,
        sessions: sessRes.sessions || []
      });
    } catch(err) {
      console.error(err);
      $("#trErr").textContent = "Error al cargar tráfico: " + err.message;
    }
  }

  function renderTraffic(d){
    const s = d.summary || {};
    allSessions = d.sessions || [];

    // Agregar usuarios encontrados en sesiones que no estuvieran en userSelect
    allSessions.forEach(x => {
      if (x.user && !knownUsers.has(x.user)) {
        knownUsers.add(x.user);
        const opt = document.createElement("option");
        opt.value = x.user;
        opt.textContent = LAN_DEVICES[x.user] ? `${x.user} (${LAN_DEVICES[x.user]})` : x.user;
        userSelect.appendChild(opt);
      }
    });

    // KPIs
    $("#trKpiTime").textContent = fmtDur(s.total_duration_sec || 0);
    $("#trKpiSessions").textContent = (s.total_sessions || 0).toLocaleString();
    const totBytes = (s.total_bytes_sent || 0) + (s.total_bytes_recv || 0);
    $("#trKpiTraffic").textContent = fmtBytes(totBytes);
    $("#trKpiTrafficSub").textContent = `↑ ${fmtBytes(s.total_bytes_sent||0)} · ↓ ${fmtBytes(s.total_bytes_recv||0)}`;
    $("#trKpiActive").textContent = s.active_sessions || 0;

    // Timeline (solo si el rango es un día: today, yesterday, o fecha específica)
    const isSingleDay = ["today", "yesterday"].includes(currentRange) || !!$("#trCustomDate").value;
    const tlWrap = $("#trTimelineWrap");
    const tlTrack = $("#trTlTrack");
    tlTrack.innerHTML = "";

    if (isSingleDay) {
      tlWrap.style.display = "flex";
      allSessions.forEach(sess => {
        const st = sess.start_time || "";
        const parts = st.split("T")[1] || st.split(" ")[1] || "";
        if (!parts) return;
        const [h, m, sec] = parts.split(":").map(Number);
        if (isNaN(h) || isNaN(m)) return;
        const startMin = h * 60 + m;
        const durMin = Math.max(2, Math.round((sess.duration_sec || 60) / 60));
        const leftPct = (startMin / 1440) * 100;
        const widthPct = Math.min(100 - leftPct, Math.max(0.4, (durMin / 1440) * 100));

        const bar = document.createElement("div");
        bar.className = "traffic-tl-bar";
        bar.style.left = `${leftPct.toFixed(2)}%`;
        bar.style.width = `${widthPct.toFixed(2)}%`;
        bar.style.background = vpnColor(sess.vpn);
        const devLabel = LAN_DEVICES[sess.user] ? ` (${LAN_DEVICES[sess.user]})` : "";
        const titleStr = `${sess.user}${devLabel} → ${sess.vpn}\nDestino: ${sess.dst_ip}:${sess.dst_port} (${sess.service})\nHora: ${st.slice(11,19)} - ${sess.end_time ? sess.end_time.slice(11,19) : 'en curso'}\nDuración: ${fmtDur(sess.duration_sec)} | Tráfico: ${fmtBytes(sess.bytes_total)}`;
        bar.title = titleStr;
        bar.onclick = () => {
          $("#trSearch").value = sess.user;
          filterTable();
        };
        tlTrack.appendChild(bar);
      });
    } else {
      tlWrap.style.display = "none";
    }

    // Top VPNs
    const vpnBox = $("#trBarsVpn");
    vpnBox.innerHTML = "";
    const vpnEntries = Object.entries(s.by_vpn || {}).sort((a,b) => b[1].bytes - a[1].bytes);
    const maxVpnBytes = vpnEntries.length ? vpnEntries[0][1].bytes : 1;
    vpnEntries.slice(0, 5).forEach(([vName, vData]) => {
      const pct = Math.max(4, Math.round((vData.bytes / (maxVpnBytes || 1)) * 100));
      const row = document.createElement("div");
      row.className = "traffic-bar-row";
      row.innerHTML = `
        <span class="traffic-bar-label" title="${esc(vName)}">${esc(vName)}</span>
        <div class="traffic-bar-track">
          <div class="traffic-bar-fill" style="width:${pct}%;background:${vpnColor(vName)}"></div>
        </div>
        <span class="traffic-bar-val">${fmtBytes(vData.bytes)}</span>
      `;
      vpnBox.appendChild(row);
    });
    if (!vpnEntries.length) vpnBox.innerHTML = `<span class="hint" style="font-size:11px">Sin actividad en este rango</span>`;

    // Top Users
    const usrBox = $("#trBarsUser");
    usrBox.innerHTML = "";
    const usrEntries = Object.entries(s.by_user || {}).sort((a,b) => b[1].bytes - a[1].bytes);
    const maxUsrBytes = usrEntries.length ? usrEntries[0][1].bytes : 1;
    usrEntries.slice(0, 5).forEach(([uName, uData]) => {
      const pct = Math.max(4, Math.round((uData.bytes / (maxUsrBytes || 1)) * 100));
      const row = document.createElement("div");
      row.className = "traffic-bar-row";
      const devName = LAN_DEVICES[uName] ? `${uName} (${LAN_DEVICES[uName]})` : uName;
      row.innerHTML = `
        <span class="traffic-bar-label" title="${esc(devName)}">${esc(devName)}</span>
        <div class="traffic-bar-track">
          <div class="traffic-bar-fill" style="width:${pct}%;background:var(--accent)"></div>
        </div>
        <span class="traffic-bar-val">${fmtBytes(uData.bytes)}</span>
      `;
      usrBox.appendChild(row);
    });
    if (!usrEntries.length) usrBox.innerHTML = `<span class="hint" style="font-size:11px">Sin actividad en este rango</span>`;

    filterTable();
  }

  function filterTable(){
    const q = ($("#trSearch").value || "").trim().toLowerCase();
    const tbody = $("#trTableBody");
    tbody.innerHTML = "";

    const filtered = allSessions.filter(x => {
      if (!q) return true;
      const dev = LAN_DEVICES[x.user] || "";
      return (x.user && x.user.toLowerCase().includes(q)) ||
             (dev && dev.toLowerCase().includes(q)) ||
             (x.vpn && x.vpn.toLowerCase().includes(q)) ||
             (x.dst_ip && x.dst_ip.includes(q)) ||
             (x.service && x.service.toLowerCase().includes(q)) ||
             (String(x.dst_port).includes(q));
    });

    $("#trTableCount").textContent = `${filtered.length} de ${allSessions.length} sesiones`;

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--muted)">No se encontraron sesiones para los filtros seleccionados</td></tr>`;
      return;
    }

    filtered.forEach(x => {
      const isAct = x.status === "active";
      const tr = document.createElement("tr");
      tr.style.borderBottom = "1px solid var(--line)";
      if (isAct) tr.style.background = "rgba(16,185,129,.04)";

      const devName = LAN_DEVICES[x.user];
      const userDisplay = devName 
        ? `<div style="font-weight:600">${esc(devName)}</div><div class="hint" style="font-size:10.5px">${esc(x.user)}</div>`
        : `<span style="font-weight:600">${esc(x.user || '-')}</span>`;

      const startTimeStr = x.start_time ? x.start_time.slice(0, 19).replace("T", " ") : "-";
      const endTimeStr = isAct ? `<span style="color:var(--good);font-weight:600">En curso</span>` : (x.end_time ? x.end_time.slice(11, 19) : "-");

      tr.innerHTML = `
        <td style="padding:7px 10px;text-align:center">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${isAct ? 'var(--good)' : 'var(--muted)'};${isAct ? 'box-shadow:0 0 6px var(--good)' : ''}" title="${isAct ? 'Sesión activa' : 'Finalizada'}"></span>
        </td>
        <td style="padding:7px 10px;cursor:pointer" title="Clic para renombrar dispositivo LAN" data-tr-dev="${esc(x.user)}">
          ${userDisplay}
        </td>
        <td style="padding:7px 10px">
          <span class="tag" style="border-left:3px solid ${vpnColor(x.vpn)};font-weight:600">${esc(x.vpn)}</span>
        </td>
        <td style="padding:7px 10px;font-family:monospace">${esc(x.dst_ip)}:${x.dst_port}</td>
        <td style="padding:7px 10px">
          <span class="tag" style="font-size:10.5px;padding:2px 6px">${esc(x.service || 'Otro')}</span>
        </td>
        <td style="padding:7px 10px;white-space:nowrap;font-size:11px">${startTimeStr}</td>
        <td style="padding:7px 10px;white-space:nowrap;font-size:11px">${endTimeStr}</td>
        <td style="padding:7px 10px;white-space:nowrap;font-weight:500">${fmtDur(x.duration_sec)}</td>
        <td style="padding:7px 10px;text-align:right;white-space:nowrap">
          <div style="font-weight:600">${fmtBytes(x.bytes_total)}</div>
          <div class="hint" style="font-size:10px">↑ ${fmtBytes(x.bytes_sent||0)} · ↓ ${fmtBytes(x.bytes_recv||0)}</div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Eventos de controles
  $$("[data-tr-range]").forEach(btn => {
    btn.onclick = () => {
      $$("[data-tr-range]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentRange = btn.dataset.trRange;
      $("#trCustomDate").value = "";
      onlyLive = false;
      $("#trBtnLive").classList.remove("active");
      loadTrafficData();
    };
  });

  $("#trCustomDate").onchange = () => {
    if ($("#trCustomDate").value) {
      $$("[data-tr-range]").forEach(b => b.classList.remove("active"));
      currentRange = "";
      onlyLive = false;
      $("#trBtnLive").classList.remove("active");
      loadTrafficData();
    }
  };

  $("#trVpnFilter").onchange = loadTrafficData;
  $("#trUserFilter").onchange = loadTrafficData;
  $("#trBtnRefresh").onclick = loadTrafficData;

  $("#trSearch").oninput = filterTable;

  $("#trBtnLive").onclick = () => {
    onlyLive = !onlyLive;
    $("#trBtnLive").classList.toggle("active", onlyLive);
    loadTrafficData();
  };

  $("#trBtnExport").onclick = () => {
    if (!allSessions.length) return toast("No hay sesiones para exportar");
    const headers = ["ID", "Estado", "Usuario", "Dispositivo", "IP Origen", "VPN", "IP Destino", "Puerto", "Servicio", "Inicio", "Fin", "Duracion_Seg", "Bytes_Subida", "Bytes_Bajada", "Bytes_Total"];
    const rows = allSessions.map(x => [
      x.id,
      x.status,
      `"${x.user || ''}"`,
      `"${LAN_DEVICES[x.user] || ''}"`,
      x.src_ip,
      `"${x.vpn || ''}"`,
      x.dst_ip,
      x.dst_port,
      `"${x.service || ''}"`,
      x.start_time,
      x.end_time || '',
      x.duration_sec,
      x.bytes_sent,
      x.bytes_recv,
      x.bytes_total
    ]);
    const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    const blob = new Blob([csvContent], {type: "text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `vpnhub-traffic-${currentRange || 'export'}-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Reporte CSV exportado");
  };

  $("#trBtnDevices").onclick = () => {
    deviceNameDialog();
  };

  $("#trafficBox").addEventListener("click", e => {
    const tdDev = e.target.closest("[data-tr-dev]");
    if (tdDev) {
      const ipOrUser = tdDev.dataset.trDev;
      if (ipOrUser && (ipOrUser.startsWith("172.") || ipOrUser.startsWith("192.") || ipOrUser.startsWith("10."))) {
        deviceNameDialog(ipOrUser);
      }
    }
  });

  loadTrafficData();
}

function deviceNameDialog(targetIp=""){
  const curName = targetIp ? (LAN_DEVICES[targetIp] || "") : "";
  const ipInput = targetIp 
    ? `<input type="text" name="dev_ip" value="${esc(targetIp)}" readonly style="font-family:monospace;background:rgba(255,255,255,.05)">`
    : `<input type="text" name="dev_ip" placeholder="ej. 192.168.1.50" required style="font-family:monospace">`;

  openDialog("Nombres amigables de IPs LAN",
    `<fieldset><legend>${targetIp ? 'Editar nombre de equipo' : 'Asignar nombre a IP de la LAN'}</legend>
       <label class="fl">Dirección IP LAN
         ${ipInput}
       </label>
       <label class="fl">Nombre del equipo / Usuario
         <input type="text" name="dev_name" placeholder="ej. Notebook Juan, Servidor Contable..." value="${esc(curName)}" required autofocus>
       </label>
     </fieldset>
     <div class="hint">Al asignar un nombre a una IP de la red local, aparecerá automáticamente en todos los registros de tráfico y reportes de auditoría en lugar de la IP numérica.</div>
     <div class="err" id="dlgDevErr"></div>`,
    `<button type="button" data-close>Cancelar</button>
     <button type="button" class="primary" id="btnSaveDev">Guardar</button>`);

  $("#btnSaveDev").onclick = async () => {
    const form = $("#dlgForm").elements;
    const ip = form.dev_ip.value.trim();
    const name = form.dev_name.value.trim();
    if (!ip) return $("#dlgDevErr").textContent = "Ingresá la IP";
    if (!name) return $("#dlgDevErr").textContent = "Ingresá un nombre";
    try {
      await post("/api/traffic/devices", {ip, name});
      dlg.close();
      toast(`IP ${ip} nombrada como "${name}"`);
      trafficDialog();
    } catch(err) {
      $("#dlgDevErr").textContent = err.message;
    }
  };
}

function logout(){
  if (!confirm("¿Cerrar sesión para ingresar con otro usuario?")) return;
  fetch("/api/logout", {method: "POST", headers: {"X-Requested-With": "vpnhub"}}).finally(() => {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/logout", true, "logout", "logout");
    xhr.onload = xhr.onerror = () => { location.href = "/login"; };
    xhr.send();
    setTimeout(() => { location.href = "/login"; }, 300);
  });
}

function meDialog(){
  openDialog(`Mi cuenta · ${ME.name}`,
    `<fieldset><legend>Acceso Remoto (Cliente WireGuard)</legend>
       <div class="row" style="align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
         <span class="hint" style="max-width:380px;line-height:1.4">Conectate a todas las redes desde cualquier lugar del mundo con WireGuard oficial. Configura DNS y rutas sin tocar nada en Windows.</span>
         <button type="button" class="btn primary" data-dl-wg="/api/me/wireguard" data-dl-name="vpnhub-${esc(ME?.name||'usuario')}.conf" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--accent);color:#fff;cursor:pointer;border:none">📥 Descargar túnel (.conf)</button>
       </div>
     </fieldset>
     <fieldset><legend>Cambiar mi contraseña</legend>
       <label class="fl full">Contraseña actual<input type="password" name="pw_old" autocomplete="current-password"></label>
       <label class="fl">Nueva<input type="password" name="pw_new" autocomplete="new-password" placeholder="mínimo 8 caracteres"></label>
       <label class="fl">Repetir<input type="password" name="pw_new2" autocomplete="new-password"></label>
     </fieldset>
     <span class="hint">Después de cambiarla, el navegador te va a pedir la nueva contraseña.</span>
     <div class="err" id="dlgErr"></div>`,
    `<button type="button" class="danger" id="btnMeLogout" style="margin-right:auto">Cerrar sesión</button>
     <button type="button" data-close>Cancelar</button>
     <button type="button" class="primary" id="btnPw">Cambiar contraseña</button>`);
  $("#btnMeLogout").onclick = () => { dlg.close(); logout(); };
  $("#btnPw").onclick = async () => {
    const f = $("#dlgForm").elements;
    if (f.pw_new.value !== f.pw_new2.value) return $("#dlgErr").textContent = "Las contraseñas nuevas no coinciden";
    try { await post("/api/me/password", {old:f.pw_old.value, new:f.pw_new.value}); dlg.close(); toast("Contraseña cambiada. Recargá la página."); }
    catch(e){ $("#dlgErr").textContent = e.message; }
  };
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", async e=>{
  const dlWg = e.target.closest("[data-dl-wg]");
  if (dlWg) {
    e.preventDefault();
    e.stopPropagation();
    downloadWgProfile(dlWg.dataset.dlWg, dlWg.dataset.dlName || "wireguard.conf");
    return;
  }
  const star = e.target.closest("[data-fav]");
  if (star){ toggleFav(star.dataset.fav); return; }
  const th = e.target.closest("th[data-sort]");
  if (th) {
    const f = th.dataset.sort;
    if (sortField === f) {
      sortOrder = sortOrder === "asc" ? "desc" : "asc";
    } else {
      sortField = f;
      sortOrder = "asc";
    }
    render();
    return;
  }
  const subBtn = e.target.closest("[data-sub-toggle]");
  if (subBtn) {
    const n = subBtn.dataset.subToggle;
    openState[n + ":sub"] = !openState[n + ":sub"];
    render();
    return;
  }
  const card = e.target.closest(".card, .row-vpn, .sub-row"), name = card?.dataset.name || $("#dlgForm").dataset.client;
  if (e.target.closest("[data-cfg]")) return configDialog(name);
  const btn = e.target.closest("button[data-act]");
  if (btn){ return act(name, btn.dataset.act); }
  const nb = e.target.closest("button[data-net]");
  if (nb && name){
    if (nb.dataset.net==="del"){ if(!confirm(`¿Borrar la red manual ${nb.dataset.real}?`)) return; await netAction(name, {action:"del", real:nb.dataset.real}); }
    if (nb.dataset.net==="add"){ const box = nb.closest(".addnet");
      const ok = await netAction(name, {action:"add", real: box.querySelector('[name=real]').value.trim(), virtual: box.querySelector('[name=virtual]').value.trim()});
      if (ok) { box.querySelector('[name=real]').value=""; box.querySelector('[name=virtual]').value=""; } }
    const inDlg = $("#cfgNets"); if (inDlg && dlg.open){ const c=data.find(x=>x.name===name); if(c) inDlg.innerHTML = netsTable(c); }
    return;
  }
  const cp = e.target.closest("[data-copy]"); if (cp && cp.dataset.copy) copy(cp.dataset.copy);
});
document.addEventListener("change", async e=>{
  const sw = e.target.closest('input[data-net]'); if (!sw) return;
  const card = e.target.closest(".card, .row-vpn, .sub-row"), name = card?.dataset.name || $("#dlgForm").dataset.client;
  if (sw.dataset.net==="auto") await netAction(name, {action:"auto", on: sw.checked});
  else await netAction(name, {action: sw.dataset.net, real: sw.dataset.real});
  const inDlg = $("#cfgNets"); if (inDlg && dlg.open){ const c=data.find(x=>x.name===name); if(c) inDlg.innerHTML = netsTable(c); }
});
document.addEventListener("submit", e=>{
  const f = e.target.closest("form[data-otp]"); if(!f) return; e.preventDefault();
  act(f.dataset.otp, "otp", {otp: f.otp.value.trim()});
});
document.addEventListener("keydown", e=>{ if (e.key==="Enter" && e.target.closest(".addnet")){ e.preventDefault(); e.target.closest(".addnet").querySelector('[data-net=add]').click(); }});
$("#filter").addEventListener("input", render);
$("#scopeFilter").addEventListener("change", render);
$("#btnViewCards").onclick = () => setViewMode("cards");
$("#btnViewList").onclick = () => setViewMode("list");
$("#btnTraffic").onclick = trafficDialog;
$("#btnUsers").onclick = usersDialog;
$("#btnLogs").onclick = logsDialog;
$("#btnMe").onclick = meDialog;
$("#btnLogout").onclick = logout;
$("#btnNew").onclick = () => META ? newDialog() : toast("cargando…");
dlg.addEventListener("close", () => { delete $("#dlgForm").dataset.client; });

(async () => {
  try { META = await api("/api/meta"); } catch(e){ toast("error: "+e.message); }
  await refresh();
  const qp = new URLSearchParams(location.search);
  if (qp.get("view") === "list") setViewMode("list");
  if (qp.get("modal") === "traffic") setTimeout(trafficDialog, 150);
  if (qp.get("modal") === "config") setTimeout(() => configDialog(qp.get("client") || (data[0] && data[0].name)), 150);
  setInterval(()=>{ if(!dlg.open && !document.querySelector(".otp input:focus")) refresh(); }, 10000);
})();
</script>
